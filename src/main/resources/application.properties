spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/unu_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}

# 액세스 토큰 1시간, 리프레시 토큰 8시간(슬라이딩)
jwt.access-token-expire-time=${JWT_ACCESS_TOKEN_EXPIRE_TIME:3600000}
jwt.refresh-token-expire-time=${JWT_REFRESH_TOKEN_EXPIRE_TIME:28800000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:3000}

# 리프레시 HttpOnly 쿠키의 Secure 속성. 로컬(http)은 false, production(https)은 true 로 주입.
auth.cookie.secure=${REFRESH_COOKIE_SECURE:false}

spring.jackson.time-zone=Asia/Seoul
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.image.upload-dir=${IMAGE_UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB